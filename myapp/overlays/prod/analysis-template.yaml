apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: myapp-success-rate
spec:
  metrics:
  - name: success-rate
    interval: 30s
    successCondition: result >= 0.99
    failureCondition: result < 0.95
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local
        query: |
          sum(rate(http_requests_total{app="myapp",status=~"2.."}[1m]))
          /
          sum(rate(http_requests_total{app="myapp"}[1m]))
