apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: myapp-chaos-health
spec:
  metrics:
  - name: availability
    interval: 30s
    count: 3
    successCondition: result >= 0.98
    failureCondition: result < 0.95
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local
        query: |
          scalar(
            sum(rate(http_requests_total{app="myapp",status=~"2.."}[1m]))
          )
          /
          scalar(
            sum(rate(http_requests_total{app="myapp"}[1m]))
          ) 
