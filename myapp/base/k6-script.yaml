apiVersion: v1
kind: ConfigMap
metadata:
  name: myapp-k6-test
data:
  test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export let options = {
      vus: 20,
      duration: '5m',
      thresholds: {
        http_req_failed: ['rate<0.05'],
        http_req_duration: ['p(95)<500'],
      },
    };

    export default function () {
      let res = http.get('http://myapp-canary.prod.svc.cluster.local:9000/health');
      check(res, {
        'status is 200': (r) => r.status === 200,
      });
      sleep(1);
    }
