apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: myapp
  namespace: prod
spec:
  replicas: 4
  minReadySeconds: 10
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: myapp
        ports:
        - containerPort: 9000

  strategy:
    canary:
      maxUnavailable: 1
      abortScaleDownDelaySeconds: 30

      canaryService: myapp-canary
      stableService: myapp-stable

      trafficRouting:
        istio:
          virtualService:
            name: myapp-vs
            routes:
              - primary
          destinationRule:
            name: myapp-dr
            canarySubsetName: canary
            stableSubsetName: stable

      steps:
      - setWeight: 10
      - pause: { duration: 2m }

      - setWeight: 30
      - pause: { duration: 2m }

      - setWeight: 60
      - pause: { duration: 2m }

      - setWeight: 100