apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: myapp
spec:
  replicas: 4
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600

  strategy:
    canary:
      canaryService: myapp-canary
      stableService: myapp-stable

      trafficRouting:
        istio:
          virtualService:
            name: myapp-vs
            routes:
              - primary
          destinationRule:
            name: myapp-dr
            canarySubsetName: canary
            stableSubsetName: stable

      steps:
      - setWeight: 10
      - pause: { duration: 2m }

      - analysis:
          templates:
          - templateName: myapp-canary-analysis

      - setWeight: 30
      - pause: { duration: 2m }

      - analysis:
          templates:
          - templateName: myapp-chaos-health

      - setWeight: 60
      - pause: { duration: 2m }

      - analysis:
          templates:
          - templateName: myapp-canary-analysis

      - setWeight: 100

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
        version: canary
    spec:
      containers:
      - name: myapp
        image: myapp:v2
        ports:
        - containerPort: 9000

        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 20

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"